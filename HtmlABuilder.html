<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTML → APK</title>
  <style>
    body{font-family:sans-serif;padding:20px;background:#111;color:#eee;max-width:700px;margin:auto}
    textarea{width:100%;height:220px;background:#222;color:#eee;border:1px solid #444;padding:8px;font-family:monospace}
    button{margin-top:12px;padding:12px 22px;background:#3a7;color:#fff;border:0;border-radius:6px;cursor:pointer}
    button:disabled{background:#555}
    #status{margin-top:14px;color:#9cf;white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>HTML → APK</h2>
  <textarea id="html">&lt;!DOCTYPE html&gt;
&lt;html&gt;&lt;body&gt;&lt;h1&gt;Hello from my APK&lt;/h1&gt;&lt;/body&gt;&lt;/html&gt;</textarea>
  <button id="go" onclick="build()">Build APK</button>
  <div id="status"></div>

<script>
async function build() {
  const status = document.getElementById('status');
  const btn = document.getElementById('go');
  btn.disabled = true;
  status.textContent = 'Uploading HTML...';

  try {
    // FIX 1: Added '/api/jobs' to the URL instead of just the root domain
    const create = await fetch('/api/jobs', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ html: document.getElementById('html').value })
    });

    // FIX 2: Safely check if the server returned an error before parsing JSON
    const responseText = await create.text();
    let data;
    try {
      data = JSON.parse(responseText);
    } catch (e) {
      throw new Error(`Server Error (Status ${create.status}). Check Render logs.`);
    }
    
    if (!create.ok) throw new Error(data.message || 'Failed to start build');
    const { id } = data;

    // 2. Poll until the APK is ready
    status.textContent = 'Building APK...';
    while (true) {
      // FIX 3: Used a relative path here too
      const r = await fetch(`/api/jobs/${id}`);
      const text = await r.text();
      let j;
      try {
        j = JSON.parse(text);
      } catch(e) {
        throw new Error(`Polling Error (Status ${r.status}). Check Render logs.`);
      }

      if (j.status === 'done') {
        status.innerHTML = `Done! <a href="${j.apk_url}" download>Download APK</a>`;
        break;
      }
      if (j.status === 'error') throw new Error(j.message);
      await new Promise(r => setTimeout(r, 3000));
    }
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
