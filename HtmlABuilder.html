<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTML → APK Studio</title>
  <!-- Background Removal Library is now loaded inside the script block below -->
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; max-width: 900px; margin: auto; }
    .row { display: flex; gap: 20px; margin-bottom: 20px; }
    .col { flex: 1; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px;}
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #aaa; }
    .drop-zone { padding: 30px; text-align: center; cursor: pointer; border: 2px dashed #444; background: #1a1a1a; border-radius: 6px; }
    .drop-zone.dragover { background: #2a2a2a; border-color: #3a7; }
    button { width: 100%; padding: 14px; background: #3a7; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:disabled { background: #555; cursor: not-allowed; }
    
    /* IDE Panels */
    .panel { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 15px; }
    #fileList { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
    #fileList li { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; color: #9cf; }
    #fileList li:hover { background: #222; }
    #codeViewer { width: 100%; height: 200px; background: #0a0a0a; color: #7af; border: 1px solid #333; padding: 10px; font-family: monospace; white-space: pre; display: none; margin-top: 10px; }
    
    /* Code Viewer */
    #codeViewer { width: 100%; height: 200px; background: #0a0a0a; color: #7af; border: 1px solid #333; padding: 10px; font-family: monospace; white-space: pre; display: none; }
    
    /* Icon Cropper */
    #cropContainer { width: 200px; height: 200px; border-radius: 20%; overflow: hidden; border: 3px solid #444; position: relative; background: #000; margin: 0 auto 10px auto; cursor: move; }
    #cropImage { position: absolute; top: 0; left: 0; display: block; user-select: none; transform-origin: center; }
    .crop-controls { text-align: center; }
    .crop-controls input[type="range"] { width: 75%; }
    .crop-controls .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .crop-controls button { width: auto; padding: 4px 8px; font-size: 11px; background: #444; color: #fff; border-radius: 4px; }
    .crop-controls span { font-size: 11px; color: #aaa; width: 30px; text-align: right; display: inline-block; }
    .rotate-dirs { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; margin-top: 5px; }
    .rotate-dirs button { flex: 1; padding: 8px 0; font-size: 14px; background: #333; border: 1px solid #555; }
    
    /* Terminal */
    #terminal { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; height: 250px; overflow-y: auto; border-radius: 6px; border: 1px solid #333; white-space: pre-wrap; margin-top: 20px; display: none;}
    .log-err { color: #f44; }
    .log-done { color: #fff; background: #3a7; padding: 5px; font-weight: bold; text-align: center; font-size: 14px; margin-top: 10px; display: block; }
  </style>
</head>
<body>
  <h2>HTML → APK Studio</h2>

  <div class="row">
    <div class="col">
      <label>App Name</label>
      <input type="text" id="appName" value="MyApp" oninput="generatePackageName()">
      
      <label>Package Name (auto-generated)</label>
      <input type="text" id="packageName" value="com.myapp.app">
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>App Icon (Optional)</label>
      <input type="file" id="iconInput" accept="image/png" style="display:none;" onchange="loadIcon(this)">
      <button type="button" id="uploadIconBtn" onclick="document.getElementById('iconInput').click()" style="padding:10px; font-size:14px; width:100%; background:#333; color:#fff; border:1px solid #444;">Upload Icon</button>
      
      <div id="iconUi" style="display: none;">
        <div id="cropContainer" onmousedown="startDrag(event)" ontouchstart="startDrag(event)">
          <img id="cropImage" src="">
        </div>
        <div class="crop-controls">
          <!-- Directional Rotation Buttons -->
          <div class="rotate-dirs">
            <button type="button" onclick="rotateStep(-90)">↺ 90°</button>
            <button type="button" onclick="rotateStep(90)">↻ 90°</button>
          </div>
          
          <div class="control-row">
            <input type="range" id="zoomSlider" min="0.1" max="3" step="0.05" value="1" oninput="updateCropTransform()">
            <span id="zoomValue">100%</span>
            <button type="button" onclick="resetZoom()">Reset</button>
          </div>
          <div class="control-row">
            <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0" oninput="updateCropTransform()">
            <span id="rotateValue">0°</span>
            <button type="button" onclick="resetRotate()">Reset</button>
          </div>
          <button type="button" id="removeBgBtn" onclick="removeBackground()" style="margin-top: 10px; width: 100%; padding: 8px; font-size: 12px; background: #5a3a7c;">✨ Remove Background</button>
          <div id="bgProgress" style="font-size: 11px; color: #9cf; margin-top: 5px; display: none;">Processing...</div>
          <button type="button" onclick="document.getElementById('iconInput').value=''; document.getElementById('iconInput').click()" style="margin-top: 10px; width: 100%; padding: 8px; font-size: 12px;">Change Image</button>
        </div>
      </div>
    </div>

    <div class="col">
      <label>Source Files</label>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>Click or Drag & Drop Files/ZIP</p>
        <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
      </div>
      <div class="panel" style="margin-top: 10px;">
        <ul id="fileList"></ul>
        <textarea id="codeViewer" readonly></textarea>
      </div>
    </div>
  </div>

  <button id="go" onclick="build()">Build APK</button>
  
  <div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/browser.js"></script>
<script>
let selectedFiles = [];
let iconDataUrl = null;
const cropImg = document.getElementById('cropImage');
let isDragging = false;
let startX, startY, imgX = 0, imgY = 0;

// --- Package Name Generator ---
function generatePackageName() {
  const name = document.getElementById('appName').value;
  const clean = name.toLowerCase().replace(/[^a-z0-9]/g, '');
  const rand = Math.floor(Math.random() * 1000);
  document.getElementById('packageName').value = `com.${clean || 'app'}.app${rand}`;
}

// --- File Handling & Explorer ---
function handleFiles(files) {
  selectedFiles = Array.from(files);
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  const viewer = document.getElementById('codeViewer');
  
  selectedFiles.forEach((file, index) => {
    const li = document.createElement('li');
    li.textContent = file.name;
    li.onclick = () => viewFile(file);
    list.appendChild(li);
  });
}

function viewFile(file) {
  const viewer = document.getElementById('codeViewer');
  viewer.style.display = 'block';
  
  if (file.type.startsWith('image/')) {
    viewer.value = "Binary image file - cannot display as text.";
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      viewer.value = e.target.result;
    };
    reader.readAsText(file);
  }
}

// --- Drag & Drop ---
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

// --- Icon Cropper Logic ---
function loadIcon(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      iconDataUrl = e.target.result;
      cropImg.src = iconDataUrl;
      
      // Reset transforms
      imgX = 0; imgY = 0;
      document.getElementById('zoomSlider').value = 1;
      document.getElementById('rotateSlider').value = 0;

      // Show UI immediately and wait a tiny fraction of a second for the browser to load the image
      document.getElementById('uploadIconBtn').style.display = 'none';
      document.getElementById('iconUi').style.setProperty('display', 'block', 'important');
      
      setTimeout(() => {
        initCrop();
      }, 50);
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function initCrop() {
  if (!cropImg.width || !cropImg.height) return; // Stop if image isn't ready yet
  
  // Center the image initially and fit it nicely
  imgX = 100 - cropImg.width / 2;
  imgY = 100 - cropImg.height / 2;
  
  // Auto-zoom if image is huge, so it fits well
  if (cropImg.width > 200 || cropImg.height > 200) {
    const scale = 200 / Math.max(cropImg.width, cropImg.height);
    document.getElementById('zoomSlider').value = scale;
  }
  updateCropTransform();
}

function updateCropTransform() {
  const zoom = document.getElementById('zoomSlider').value;
  const rotate = document.getElementById('rotateSlider').value;
  
  cropImg.style.transform = `translate(${imgX}px, ${imgY}px) scale(${zoom}) rotate(${rotate}deg)`;
  
  // Update the text labels
  document.getElementById('zoomValue').textContent = Math.round(zoom * 100) + '%';
  document.getElementById('rotateValue').textContent = rotate + '°';
}

function rotateStep(degrees) {
  let current = parseInt(document.getElementById('rotateSlider').value);
  let next = current + degrees;
  
  // Keep the rotation within the slider's bounds (-180 to 180)
  if (next > 180) next -= 360;
  if (next < -180) next += 360;
  
  document.getElementById('rotateSlider').value = next;
  updateCropTransform();
}

function resetZoom() {
  document.getElementById('zoomSlider').value = 1;
  updateCropTransform();
}

function resetRotate() {
  document.getElementById('rotateSlider').value = 0;
  updateCropTransform();
}

function startDrag(e) {
  if (!iconDataUrl) return;
  isDragging = true;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  startX = clientX - imgX;
  startY = clientY - imgY;
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchmove', onDrag, {passive: false});
  document.addEventListener('touchend', stopDrag);
}

function onDrag(e) {
  if (!isDragging) return;
  e.preventDefault();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  imgX = clientX - startX;
  imgY = clientY - startY;
  updateCropTransform();
}

function stopDrag() {
  isDragging = false;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchmove', onDrag);
  document.removeEventListener('touchend', stopDrag);
}

// Background Removal
async function removeBackground() {
  if (!iconDataUrl) return;
  
  const btn = document.getElementById('removeBgBtn');
  const progress = document.getElementById('bgProgress');
  
  btn.disabled = true;
  progress.style.display = 'block';
  progress.textContent = 'AI is thinking (this takes ~5-10 seconds)...';

  try {
    // Check if the library loaded successfully
    if (!window.imgly || !window.imgly.removeBackground) {
      throw new Error("AI Library is still loading or blocked. Please wait a few seconds and try again.");
    }

    // Convert the current image to a blob for the AI to process
    const response = await fetch(iconDataUrl);
    const blob = await response.blob();

    // Run the AI
    const newBlob = await window.imgly.removeBackground(blob);
    
    // Convert the result back to a Base64 string
    const reader = new FileReader();
    reader.onload = (e) => {
      iconDataUrl = e.target.result;
      cropImg.src = iconDataUrl;
      
      // Reset crop settings
      imgX = 0; imgY = 0;
      document.getElementById('zoomSlider').value = 1;
      document.getElementById('rotateSlider').value = 0;
      setTimeout(() => { initCrop(); }, 50);

      progress.style.display = 'none';
      btn.disabled = false;
    };
    reader.readAsDataURL(newBlob);
    
  } catch (error) {
    console.error(error);
    progress.textContent = 'Error: ' + error.message;
    progress.style.color = '#f44';
    btn.disabled = false;
  }
}

// Convert cropped canvas to blob for upload
async function getCroppedIconBlob() {
  if (!iconDataUrl) return null;
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = "#000"; // Background
    ctx.fillRect(0, 0, 512, 512);
    
    const zoom = document.getElementById('zoomSlider').value;
    const rotate = document.getElementById('rotateSlider').value * (Math.PI / 180);
    
    ctx.translate(256 + (imgX * 2.56), 256 + (imgY * 2.56));
    ctx.rotate(rotate);
    ctx.scale(zoom * 2.56, zoom * 2.56);
    
    ctx.drawImage(cropImg, -cropImg.width/2, -cropImg.height/2);
    
    canvas.toBlob((blob) => resolve(new File([blob], 'icon.png', {type: 'image/png'})), 'image/png');
  });
}

// Initialize slider labels
updateCropTransform();

// --- Build & Terminal ---
async function build() {
  const btn = document.getElementById('go');
  const term = document.getElementById('terminal');
  
  if (selectedFiles.length === 0) {
    alert('Please select source files first.');
    return;
  }

  btn.disabled = true;
  term.style.display = 'block';
  term.innerHTML = 'Starting upload...\n';

  const formData = new FormData();
  formData.append('appName', document.getElementById('appName').value);
  formData.append('packageName', document.getElementById('packageName').value);
  
  if (iconDataUrl) {
    const croppedIcon = await getCroppedIconBlob();
    formData.append('files', croppedIcon, 'icon.png');
  }

  selectedFiles.forEach(file => {
    formData.append('files', file);
  });

  try {
    const create = await fetch('/api/jobs', { method: 'POST', body: formData });
    const data = await create.json();
    if (!create.ok) throw new Error(data.message || 'Failed to start');

    // Connect to SSE for live logs
    const evtSource = new EventSource('/api/logs/' + data.id);
    
    evtSource.onmessage = function(event) {
      const msg = event.data;
      
      if (msg === 'DONE') {
        evtSource.close();
        term.innerHTML += '<span class="log-done">✅ BUILD COMPLETE! <a href="/api/jobs/'+data.id+'/apk" download style="color:#fff; text-decoration:underline;">Download APK</a></span>';
        btn.disabled = false;
        return;
      }
      
      if (msg === 'ERROR') {
        evtSource.close();
        term.innerHTML += '<span class="log-err">❌ Build failed. Check logs above.</span>';
        btn.disabled = false;
        return;
      }

      // Append log line
      term.innerHTML += msg + '\n';
      term.scrollTop = term.scrollHeight;
    };

    evtSource.onerror = function() {
      evtSource.close();
      term.innerHTML += '\n<span class="log-err">Connection lost.</span>';
      btn.disabled = false;
    };

  } catch (e) {
    term.innerHTML += '\n<span class="log-err">Error: ' + e.message + '</span>';
    btn.disabled = false;
  }
}


</script>
</body>
</html>
